{% extends 'base.html' %}
{% block content %}
<section class="container py-5">
  <div class="hero rounded-4 p-4 p-md-5 mb-4">
    <p class="small text-uppercase fw-bold">{{ current_user.role.replace('_', ' ') }}</p>
    <h1 class="h2">{% block heading %}{% endblock %}</h1>
    <p class="mb-0">Welcome, {{ current_user.full_name }}.</p>
  </div>
  {% block dashboard_content %}{% endblock %}
</section>
{% endblock %}
