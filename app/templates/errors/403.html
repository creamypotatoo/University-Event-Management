{% extends 'base.html' %}
{% block title %}Access denied{% endblock %}
{% block content %}
<section class="container py-5"><div class="feature-card p-4 p-md-5">
  <p class="text-secondary">403 · Access denied</p><h1 class="h2">You don’t have access to this page.</h1>
  <p>Your account role or club assignment does not permit this action.</p>
  <a class="btn btn-campus" href="{{ url_for('dashboards.index') if current_user.is_authenticated else url_for('auth.login') }}">Return to your dashboard</a>
</div></section>
{% endblock %}
